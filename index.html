<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Demo offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #eef8f4; color: #163b35; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>This technical demo is offline</h1>
      <p>The private, local-first family application is being developed separately.</p>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
      }
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      }
    </script>
  </body>
</html>
